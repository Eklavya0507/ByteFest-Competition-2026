<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Code Sprint Control | BYTEFEST 2026</title>
<link rel="stylesheet" href="codesprint.css?v=1.0.0">
<script src="config.js?v=1.0.0" defer></script>
<script src="codesprint-admin.js?v=1.0.0" defer></script>
</head>
<body>
<main class="cs-admin-shell">
<div class="cs-brand"><span class="cs-mark">CS</span><div><strong>BYTEFEST 2026</strong><small>CODE SPRINT · CONTROL CENTER</small></div></div>
<h1 class="cs-title">Code Sprint Control</h1>
<p class="cs-subtitle">Create teams here. Team IDs and passwords are generated automatically.</p>

<section class="cs-card" style="padding:20px;margin:20px 0">
<h2>Add Team</h2>
<form id="createTeamForm">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
<label class="cs-field">Team Name<input id="newTeamName" required placeholder="Code Warriors"></label>
<label class="cs-field">Member 1<input id="member1" placeholder="Member name"></label>
<label class="cs-field">Member 2<input id="member2" placeholder="Member name"></label>
<label class="cs-field">Member 3<input id="member3" placeholder="Member name"></label>
</div>
<button class="cs-btn primary" type="submit">CREATE TEAM</button>
<div class="cs-status" id="createTeamStatus"></div>
</form>
</section>

<div class="cs-admin-actions">
<button class="cs-btn" id="refreshTeams" type="button">REFRESH TEAMS</button>
<a class="cs-btn" href="codesprint-projector.html" target="_blank">OPEN PROJECTOR LEADERBOARD</a>
<button class="cs-btn danger" id="adminLogout" type="button">LOGOUT</button>
</div>

<div class="cs-table-wrap">
<table class="cs-table">
<thead><tr><th>Team ID</th><th>Team</th><th>Password</th><th>Members</th><th>Round</th><th>Stage</th><th>R1</th><th>R2</th><th>Qualifier</th><th>Total</th><th>Rank</th><th>Security</th><th>Action</th></tr></thead>
<tbody id="teamRows"></tbody>
</table>
</div>
<div class="cs-status" id="adminStatus"></div>
</main>
</body>
</html>
