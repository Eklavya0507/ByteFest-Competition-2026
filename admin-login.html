<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Competition Admin | BYTEFEST 2026</title>
  <link rel="stylesheet" href="competition.css?v=12.0.0">
  <script src="config.js?v=2.0.0" defer></script>
  <script src="admin-login.js?v=2.0.0" defer></script>
</head>
<body>
<main class="login-wrap">
  <section class="card login-card">
    <div class="login-logo">
      <div class="logo-orb"><img src="assets/invictus-logo.png" alt="Invictus Tech Club"></div>
      <div class="kicker">BYTEFEST 2026 · COMPETITION CONTROL</div>
      <h1>Coordinator Login</h1>
      <p>Use the competition admin password configured on the backend.</p>
    </div>
    <form id="adminLoginForm" autocomplete="off">
      <div class="field">
        <label for="adminPassword">Admin Password</label>
        <input class="input" id="adminPassword" type="password" required autocomplete="off" placeholder="Admin password">
      </div>
      <button class="btn primary" id="adminLoginButton" type="submit" style="width:100%">LOGIN</button>
      <div class="status" id="adminLoginStatus"></div>
    </form>
  </section>
</main>
</body>
</html>
