<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Participant Login | BYTEFEST 2026</title><link rel="stylesheet" href="competition.css?v=2.0.0"><script src="config.js?v=2.0.0" defer></script><script src="participant-login.js?v=2.0.0" defer></script></head><body><main class="login-wrap"><section class="card login-card"><div class="login-logo"><div class="logo-orb"><img src="assets/invictus-logo.png" alt="Invictus Tech Club"></div><div class="kicker">BYTEFEST 2026 · INVICTUS TECH CLUB</div><h1>Participant Login</h1><p>Select your event and enter the Registration ID generated by the BYTEFEST registration website.</p></div><form id="participantLoginForm"><div class="field"><label for="event">Event</label><select class="select" id="event" required><option value="">Select event</option><option value="Code Sprint">Code Sprint</option><option value="Bug Hunt">Bug Hunt</option><option value="Checkmate" disabled>Checkmate — setup pending</option></select></div><div class="field"><label for="registrationId">Registration ID</label><input class="input" id="registrationId" autocomplete="off" placeholder="BF26-XXXXXXXX" maxlength="13" required></div><div class="field"><label for="password">Competition Password</label><input class="input" id="password" type="password" autocomplete="off" placeholder="Enter team password" required></div><div class="status" id="loginStatus"></div><button class="btn primary" style="width:100%" id="loginButton" type="submit">ENTER COMPETITION</button></form><p style="font-size:12px;text-align:center;margin-top:18px">Participant mode intentionally has no Back button. Keep your Registration ID private.</p></section></main></body></html>
